name: Build & Deploy Spring App
on:
  push:
    branches:
      - main



jobs:
  build-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Java 21
      - uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'corretto'
      - name: Unit test
        run: mvn -B test --file pom.xml
      - name: Build
        run: |
          mvn clean
          mvn -B package --file pom.xml
          

