name: Build & Deploy Spring App
on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Java 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Unit test
        run: mvn -B test --file pom.xml

      - name: Build
        run: mvn clean package -B

      - name: Set image tag
        id: vars
        run: echo "tag=$(date +%Y-%m-%d)-spring-app" >> "$GITHUB_OUTPUT"

      - name: Create Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          dockerfile: Dockerfile
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/${{ steps.vars.outputs.tag }}:latest
      - name: Login to Docker Hub
        run: docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} -p ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Push to Docker Hub
        run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/${{ steps.vars.outputs.tag }}:latest
